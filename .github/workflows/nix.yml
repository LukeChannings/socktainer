# socktainer Nix build gate + binary cache push.
#
# This is OUR workflow (the LukeChannings fork's); the sibling workflows in
# this directory are inherited from upstream socktainer/socktainer.
#
# What it does:
#   * PRs + pushes to main: build the flake's `socktainer` package — the
#     same derivation consumers get from `packages.aarch64-darwin.socktainer`
#     / `overlays.default` — and smoke-test the binary.
#   * Then pushes the built store path to the niks3 binary cache at
#     https://nix.channings.me so consumers (hartlandia) substitute instead of
#     rebuilding. The closure is just the binary: package.nix fails the build
#     if it picks up any /nix/store runtime dependency.
#
# Why a macOS runner with Xcode: socktainer links Apple's Containerization
# frameworks, so package.nix is an impure derivation (`__noChroot = true`)
# that shells out to the host's `/usr/bin/xcrun swift build`. That needs:
#   * `sandbox = relaxed`, so the daemon honours `__noChroot`;
#   * Xcode selected system-wide with `xcode-select`. Builds run as the
#     daemon's `_nixbld` users, so a job-level DEVELOPER_DIR never reaches
#     them.
# Runner image (preview), see images/macos/xcode-27-arm64-Readme.md in
# https://github.com/actions/runner-images
#
# Secrets:
#   NIKS3_CI_TOKEN — the Kanidm CI service-account API token. The push step
#   exchanges it (RFC 8693) at id.channings.me for a short-lived aud=niks3
#   OIDC token; niks3 grants it write scope and signs server-side, so no
#   client signing key is needed (ADR-0010). A static niks3 token is NOT used
#   — it expires and 401s. Must be a member of the niks3_ci Kanidm group.
---
name: nix

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build socktainer
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        # An explicit `shell: bash` runs with `-eo pipefail`; the implicit
        # default is `bash -e` only, which let `nix build ... | tee` pass
        # with tee's exit status when the build itself failed.
        shell: bash
    env:
      # Pinned rather than the image default (/Applications/Xcode.app), so an
      # image update that moves the default to a newer Xcode can't silently
      # change the toolchain that built a cached path. Bump deliberately.
      XCODE_APP: /Applications/Xcode_27.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes back to the repo; don't leave the token on disk.
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcrun swift --version

      # Unwrappable: a SHA pin (with Dependabot's version comment) and a
      # cache public key inside a block scalar.
      # yamllint disable rule:line-length
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          # Upstream Nix, as in the NixOS fork's workflow — not Determinate
          # Nix, which would also try to log in to FlakeHub.
          determinate: false
          extra-conf: |
            sandbox = relaxed
            extra-substituters = https://nix.channings.me
            extra-trusted-public-keys = garage:JZet/fsItH8cJ6SKLci1+BuMIQGDfZSa/8GxGpKcxss=
      # yamllint enable rule:line-length

      - name: Build socktainer
        # The store path lands in $RUNNER_TEMP/socktainer-paths for the push
        # step. A cache hit substitutes it instead of rebuilding.
        run: |
          nix build --print-build-logs --no-link --print-out-paths \
            .#packages.aarch64-darwin.socktainer \
            | tee "$RUNNER_TEMP/socktainer-paths"

      - name: Smoke test
        run: |
          out="$(head -n 1 "$RUNNER_TEMP/socktainer-paths")"
          "$out/bin/socktainer" --version
          /usr/bin/otool -L "$out/bin/socktainer"

      # The refresher heredoc carries an irreducible OIDC URN and jq filter.
      # yamllint disable rule:line-length
      - name: Push to cache
        # Pushes on PRs too (same-repo branches only — fork PRs get no
        # secrets), so a branch's build is cached before it merges. niks3
        # walks and uploads the full closure of the given paths.
        if: >-
          ${{ github.event.pull_request.head.repo.full_name == github.repository
          || github.event_name == 'push' }}
        env:
          # Per ADR-0010, CI authenticates to niks3 via OIDC: a long-lived
          # Kanidm service-account token, exchanged (RFC 8693) for a
          # short-lived aud=niks3 access token. A static niks3 token was
          # deliberately rejected there — it expires (~15m) and then silently
          # 401s, which is exactly how this step failed. The refresher below
          # re-mints on demand via --auth-token-script, so a build that
          # outlasts one token still pushes.
          NIKS3_CI_TOKEN: ${{ secrets.NIKS3_CI_TOKEN }}
        run: |
          if [ -z "$NIKS3_CI_TOKEN" ]; then
            echo "::error::NIKS3_CI_TOKEN secret is empty or not set"
            exit 1
          fi
          # macOS /bin/bash is 3.2: no `mapfile`.
          paths=()
          while IFS= read -r path || [ -n "$path" ]; do
            if [ -n "$path" ]; then paths+=("$path"); fi
          done < "$RUNNER_TEMP/socktainer-paths"
          if [ "${#paths[@]}" -eq 0 ]; then
            echo "error: no store paths to push" >&2
            exit 1
          fi
          # Seed the Kanidm CI token + a refresher that exchanges it (RFC 8693)
          # at the Kanidm token endpoint for an aud=niks3 OIDC token. niks3's
          # provider grants `write` to any aud=niks3 token, and only niks3_ci
          # group members can mint one. The emitted JSON ({token, expires_at})
          # is niks3's auth-token-script contract; expires_at lets it cache
          # until 75% of the token's life, then re-mint.
          install -d -m 700 "$HOME/.config/niks3"
          umask 077
          printf '%s' "$NIKS3_CI_TOKEN" > "$HOME/.config/niks3/ci-token"
          cat > "$HOME/.config/niks3/refresh-token" <<'SCRIPT'
          set -euo pipefail
          resp=$(curl -fsS -X POST "https://id.channings.me/oauth2/token" \
            -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            -d audience=niks3 \
            -d scope=openid \
            -d subject_token_type=urn:ietf:params:oauth:token-type:access_token \
            -d client_id=niks3 \
            --data-urlencode subject_token@"$HOME/.config/niks3/ci-token")
          printf '%s' "$resp" | jq -e 'if .access_token then {token: .access_token, expires_at: (now + (.expires_in // 900) | todate)} else error("niks3 token exchange returned no access_token") end'
          SCRIPT
          # --server-url is the niks3 coordinator API, not the cache: the cache
          # (extra-substituters, read-only Garage web) is nix.channings.me;
          # the niks3 API that `push` POSTs to lives at niks3.nix.channings.me.
          # niks3 shell-splits --auth-token-script and execs argv[0] directly,
          # so pass this step's bash ($BASH, absolute) as the interpreter for
          # the shebang-less refresher. jq (used by the refresher) is put on
          # PATH via `nix shell`; curl is already at /usr/bin on macOS.
          nix shell nixpkgs#jq --command \
            nix run github:Mic92/niks3 -- push \
              --server-url https://niks3.nix.channings.me \
              --auth-token-script "$BASH $HOME/.config/niks3/refresh-token" \
              "${paths[@]}"
      # yamllint enable rule:line-length
